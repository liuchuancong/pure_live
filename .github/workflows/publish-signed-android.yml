name: publish-signed-android

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful manual-build run containing pure-live-android
        required: true
        type: string
      tag:
        description: Release tag, for example v2.0.26
        required: true
        type: string
      target_sha:
        description: Exact source commit used by the Android build
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Download signed artifact from the selected run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pure-live-android
          path: signed
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify package identity, ABI and release certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find signed -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          badging="$($build_tools/aapt dump badging "$apk")"
          grep -F "package: name='com.mystyle.purelive'" <<<"$badging"
          grep -F "versionName='2.0.26'" <<<"$badging"
          grep -F "native-code: 'arm64-v8a'" <<<"$badging"
          certificate="$($build_tools/apksigner verify --verbose --print-certs "$apk")"
          grep -Fi 'Signer #1 certificate SHA-256 digest: c0bb95744c81f9c7dd4535a9552775038eb5a59c5922f791d1695f45ac34ceaf' <<<"$certificate"
          output='PureLive-2.0.26-37-arm64-v8a-release.apk'
          mv "$apk" "$output"
          sha256sum "$output" | sed 's/  / */' > ANDROID_SHA256SUM.txt
          echo "apk=$output" >> "$GITHUB_OUTPUT"

      - name: Create or update the formal release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          APK: ${{ steps.verify.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" ANDROID_SHA256SUM.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" ANDROID_SHA256SUM.txt \
              --target "$TARGET_SHA" --title "Pure Live $TAG" \
              --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
