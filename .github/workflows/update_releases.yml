name: 手动更新历史发布数据

on:
  workflow_dispatch:

  schedule:
    # 每 48 小时执行一次
    - cron: '0 0 */2 * *'

permissions:
  contents: read

concurrency:
  group: release-index-master
  cancel-in-progress: false

jobs:
  update-json:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # 3. 运行更新脚本
      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tool/update_releases.py

      # 4. Commit and Push
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- assets/releases.json; then
            git add assets/releases.json
            git commit -m "chore: update releases.json [skip ci]"

            git pull --rebase origin master

            git push origin master
          else
            echo "数据未发生变化，无需更新。"
          fi