name: manual-build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android arm64-v8a APK
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows portable archive
        required: true
        type: boolean
        default: false
      build_linux:
        description: Build Linux x64 portable archive
        required: true
        type: boolean
        default: false
      build_macos:
        description: Build macOS arm64 application archive
        required: true
        type: boolean
        default: false
      build_ios:
        description: Build unsigned iOS device application archive
        required: true
        type: boolean
        default: false
      run_quality:
        description: Run analyze, tests and public interface probes first
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "stage-build-*"
      - "stage-linux-*"
      - "stage-apple-*"

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  quality:
    name: Analyze, test and probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_quality }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "25"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Probe public interfaces
        run: python tool/interface_probe.py

  android:
    name: Android arm64-v8a APK
    if: ${{ always() && inputs.build_android && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PURELIVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PURELIVE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PURELIVE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PURELIVE_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Release signing secrets are required for the manual Android package." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pure-live-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/pure-live-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build arm64-v8a release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-android
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows portable
    if: ${{ always() && inputs.build_windows && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        run: flutter build windows --release --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PureLive-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-windows
          path: PureLive-windows-x64.zip
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux x64 portable
    if: ${{ always() && ((github.event_name == 'push' && (startsWith(github.ref_name, 'stage-build-') || startsWith(github.ref_name, 'stage-linux-'))) || inputs.build_linux) && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev \
            libepoxy-dev libsecret-1-dev libwayland-dev libwpe-1.0-dev \
            libwpebackend-fdo-1.0-dev libwpewebkit-1.0-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        run: flutter build linux --release --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Create portable archive
        run: tar -C build/linux/x64/release/bundle -czf PureLive-linux-x64.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-linux-x64
          path: PureLive-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3

  apple:
    name: Apple platform packages
    if: ${{ always() && ((github.event_name == 'push' && (startsWith(github.ref_name, 'stage-build-') || startsWith(github.ref_name, 'stage-apple-'))) || inputs.build_macos || inputs.build_ios) && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: quality
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select an Xcode 26 toolchain
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build macOS release
        if: ${{ github.event_name == 'push' || inputs.build_macos }}
        run: flutter build macos --release --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Archive macOS application
        if: ${{ github.event_name == 'push' || inputs.build_macos }}
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" PureLive-macos-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'push' || inputs.build_macos }}
        with:
          name: pure-live-macos-arm64
          path: PureLive-macos-arm64.zip
          if-no-files-found: error
          retention-days: 3
      - name: Build iOS device application
        if: ${{ github.event_name == 'push' || inputs.build_ios }}
        run: flutter build ios --release --no-codesign --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Archive iOS application
        if: ${{ github.event_name == 'push' || inputs.build_ios }}
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app PureLive-ios-unsigned-app.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'push' || inputs.build_ios }}
        with:
          name: pure-live-ios-unsigned-app
          path: PureLive-ios-unsigned-app.zip
          if-no-files-found: error
          retention-days: 3
