name: manual-build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android split APKs
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows portable archive
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  quality:
    name: Analyze, test and probe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Probe public interfaces
        run: python tool/interface_probe.py

  android:
    name: Android APKs
    if: inputs.build_android
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PURELIVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PURELIVE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PURELIVE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PURELIVE_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Release signing secrets are required for the manual Android package." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pure-live-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/pure-live-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-android
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows portable
    if: inputs.build_windows
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        run: flutter build windows --release --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PureLive-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-windows
          path: PureLive-windows-x64.zip
          if-no-files-found: error
          retention-days: 3
