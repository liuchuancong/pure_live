# Module: .github/workflows/architecture.yml
# Purpose: Run the v2 architecture guard and the repository tooling regression suites on every change.
name: Architecture

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

# The guard only reads the repository; it never needs write access.
permissions:
  contents: read

jobs:
  guard:
    name: Package layout and dependency direction
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      # Generated files are not committed (see docs/decisions/0001), so nothing
      # after this point can analyse or test a package that uses Freezed until
      # they exist. This step was missing entirely, which meant a clean checkout
      # could not pass its own analyzer.
      - name: Generate code
        run: dart run melos run gen
      - name: Architecture guard
        # The guard that exists and passes: dependency direction, UI-core boundary,
        # adapter isolation. It replaces a step pointing at a file that is not in
        # the repository, which made this job unable to pass on any commit.
        shell: pwsh
        run: ./tool/check_architecture.ps1
      - name: Format check
        # The v2 surface only: tool/probes holds opt-in v1 native probes that are not style-gated.
        run: dart format --output=none --set-exit-if-changed packages
      - name: Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Reports rather than gates, on purpose: the required-files check currently
      # finds 57 pre-existing gaps (missing README/CHANGELOG/test, one package name
      # without the live_ prefix). Making it fatal would turn this job red for
      # findings that predate it; it flips to a gate when the count reaches zero.
      - name: Package required files
        shell: pwsh
        continue-on-error: true
        run: ./tool/validate_packages.ps1
