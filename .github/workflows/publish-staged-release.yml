name: Publish staged all-platform release

on:
  workflow_dispatch:
    inputs:
      stage_run_id:
        description: Completed feature-build run containing Linux, macOS and iOS artifacts
        required: true
        type: string
      android_run_id:
        description: Completed local-signed-android run containing the signed arm64 APK
        required: true
        type: string
      release_tag:
        description: Release tag matching the version in pubspec.yaml
        required: true
        type: string
        default: v2.9.5
      target_sha:
        description: Exact source commit shared by every platform artifact
        required: true
        type: string
      windows_source:
        description: Build Windows on the local runner or reuse packages pre-uploaded to the draft release
        required: true
        type: choice
        options:
          - self-hosted
          - preuploaded-release
        default: self-hosted
      preuploaded_windows_signing:
        description: Signing state of Windows packages reused from the draft release
        required: true
        type: choice
        options:
          - unsigned
          - authenticode
        default: unsigned

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-staged-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64 on local runner
    if: ${{ inputs.windows_source == 'self-hosted' }}
    runs-on: [self-hosted, Windows, X64, pure-live-local]
    timeout-minutes: 75
    steps:
      - name: Preserve compatible packages from the previous local job
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'local-artifacts'
          $cache = Join-Path $env:RUNNER_TEMP 'pure-live-prebuilt-windows'
          Remove-Item -LiteralPath $cache -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $source -PathType Container) {
            Copy-Item -LiteralPath $source -Destination $cache -Recurse -Force
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Restore packages when only the publisher workflow changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'pure-live-prebuilt-windows'
          $metadataPath = Get-ChildItem $cache -Filter BUILD_METADATA.json `
            -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metadataPath) { exit 0 }
          $metadata = Get-Content -LiteralPath $metadataPath.FullName -Raw | ConvertFrom-Json
          if ($metadata.tracked_files_dirty -or -not $metadata.source_commit) { exit 0 }
          git cat-file -e "$($metadata.source_commit)^{commit}"
          if ($LASTEXITCODE -ne 0) { exit 0 }
          $changed = @(git diff --name-only $metadata.source_commit '${{ inputs.target_sha }}' -- .)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 0) { exit 0 }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'local-artifacts'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $cache '*') -Destination $destination -Recurse -Force
          "PURELIVE_WINDOWS_REUSED=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows portable archive and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PURELIVE_WINDOWS_REUSED -eq 'true') {
            Write-Host 'Reusing Windows packages because only the publisher workflow changed.'
            exit 0
          }
          PowerShell -ExecutionPolicy Bypass -File .\tool\build_local_release.ps1 `
            -Target WindowsX64 -Configuration Release -SkipQuality -DedicatedBuild

      - name: Verify Windows packages
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $artifactVersion = $version.Replace('+', '-')
          $directory = Join-Path 'local-artifacts' $artifactVersion
          $portable = Join-Path $directory "PureLive-$artifactVersion-windows-x64-portable.zip"
          $installer = Join-Path $directory "PureLive-$artifactVersion-windows-x64-setup.exe"
          foreach ($file in @($portable, $installer)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected Windows package is missing: $file"
            }
          }
          $entries = tar -tf $portable
          if ($entries | Where-Object { $_ -match '(^|/)(AppData|IPTV_CACHE)(/|$)' }) {
            throw 'Runtime state was found in the Windows portable package.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signing = if ($signature.Status -eq 'Valid') { 'authenticode' } else { 'unsigned' }
          Set-Content -LiteralPath (Join-Path $directory 'WINDOWS_SIGNING.txt') `
            -Value $signing -Encoding ascii
          $metadata = Get-Content -LiteralPath (Join-Path $directory 'BUILD_METADATA.json') `
            -Raw | ConvertFrom-Json
          Set-Content -LiteralPath (Join-Path $directory 'WINDOWS_SOURCE_COMMIT.txt') `
            -Value $metadata.source_commit -Encoding ascii

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-windows-release
          path: |
            local-artifacts/*/PureLive-*-windows-x64-portable.zip
            local-artifacts/*/PureLive-*-windows-x64-setup.exe
            local-artifacts/*/WINDOWS_SIGNING.txt
            local-artifacts/*/WINDOWS_SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Verify and publish all platforms
    needs: windows
    if: ${{ always() && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      STAGE_RUN_ID: ${{ inputs.stage_run_id }}
      ANDROID_RUN_ID: ${{ inputs.android_run_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      PREUPLOADED_WINDOWS_SIGNING: ${{ inputs.preuploaded_windows_signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Validate source runs
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          stage_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID")"
          android_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN_ID")"
          test "$(jq -r .status <<<"$stage_json")" = completed
          test "$(jq -r .conclusion <<<"$stage_json")" = success
          test "$(jq -r .status <<<"$android_json")" = completed
          test "$(jq -r .conclusion <<<"$android_json")" = success
          test "$(jq -r .path <<<"$stage_json")" = .github/workflows/feature-build.yml
          test "$(jq -r .path <<<"$android_json")" = .github/workflows/feature-build.yml
          test "$(jq -r .head_sha <<<"$stage_json")" = "$TARGET_SHA"
          test "$(jq -r .head_sha <<<"$android_json")" = "$TARGET_SHA"
          echo "stage_sha=$(jq -r .head_sha <<<"$stage_json")" >> "$GITHUB_OUTPUT"
          echo "android_sha=$(jq -r .head_sha <<<"$android_json")" >> "$GITHUB_OUTPUT"

      - name: Download local Windows packages
        if: ${{ inputs.windows_source == 'self-hosted' }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.1
        with:
          name: pure-live-windows-release
          path: downloads/windows

      - name: Download pre-uploaded local Windows packages
        if: ${{ inputs.windows_source == 'preuploaded-release' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/windows
          gh release download "$RELEASE_TAG" \
            --pattern 'PureLive-*-windows-x64-portable.zip' \
            --pattern 'PureLive-*-windows-x64-setup.exe' \
            --dir downloads/windows \
            --repo "$GITHUB_REPOSITORY"
          printf '%s\n' "$PREUPLOADED_WINDOWS_SIGNING" \
            > downloads/windows/WINDOWS_SIGNING.txt
          printf '%s\n' "$TARGET_SHA" \
            > downloads/windows/WINDOWS_SOURCE_COMMIT.txt

      - name: Download signed Android package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.1
        with:
          name: pure-live-android
          path: downloads/android
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}

      - name: Download staged Linux package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.1
        with:
          name: pure-live-linux-x64
          path: downloads/linux
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}

      - name: Download staged macOS packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.1
        with:
          name: pure-live-macos
          path: downloads/macos
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}

      - name: Download staged iOS package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.1
        with:
          name: pure-live-ios
          path: downloads/ios
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}

      - name: Verify Android release signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find downloads/android -type f -name 'PureLive-*-android-arm64-v8a-release.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$apksigner"
          certificate_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certificate_output"
          certificate="$(awk -F ': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' <<<"$certificate_output")"
          test -n "$certificate"
          echo "Android signer SHA-256: $certificate" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble and verify canonical release assets
        env:
          STAGE_SHA: ${{ steps.sources.outputs.stage_sha }}
          ANDROID_SHA: ${{ steps.sources.outputs.android_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil

          root = pathlib.Path.cwd()
          downloads = root / "downloads"
          output = root / "release-assets"
          output.mkdir()

          version_match = re.search(
              r"^version:\s*(\S+)",
              (root / "pubspec.yaml").read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          if not version_match:
              raise SystemExit("pubspec version is missing")
          full_version = version_match.group(1)
          display_version = full_version.split("+", 1)[0]
          artifact_version = full_version.replace("+", "-")
          if os.environ["RELEASE_TAG"] != f"v{display_version}":
              raise SystemExit("release tag does not match pubspec version")

          expected = [
              f"PureLive-{artifact_version}-android-arm64-v8a-release.apk",
              f"PureLive-{artifact_version}-windows-x64-portable.zip",
              f"PureLive-{artifact_version}-windows-x64-setup.exe",
              f"PureLive-{artifact_version}-linux-x64.tar.gz",
              f"PureLive-{artifact_version}-macos-universal.zip",
              f"PureLive-{artifact_version}-macos-universal.dmg",
              f"PureLive-{artifact_version}-ios-arm64-unsigned-app.zip",
              f"PureLive-{artifact_version}-ios-arm64-trollstore.ipa",
          ]
          for name in expected:
              matches = [path for path in downloads.rglob(name) if path.is_file()]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {name}, found {len(matches)}")
              shutil.copy2(matches[0], output / name)

          android_metadata = []
          for path in (downloads / "android").rglob("BUILD_METADATA.json"):
              try:
                  android_metadata.append(json.loads(path.read_text(encoding="utf-8-sig")))
              except (OSError, json.JSONDecodeError):
                  pass
          if android_metadata and not any(
              item.get("android_signing") == "release"
              and item.get("source_commit") == os.environ["ANDROID_SHA"]
              and item.get("version") == full_version
              for item in android_metadata
          ):
              raise SystemExit("signed Android verification metadata did not match the source run")

          signing_files = list((downloads / "windows").rglob("WINDOWS_SIGNING.txt"))
          if len(signing_files) != 1:
              raise SystemExit("Windows signing metadata is missing")
          windows_signing = signing_files[0].read_text(encoding="ascii").strip()
          if windows_signing not in {"unsigned", "authenticode"}:
              raise SystemExit("Windows signing metadata is invalid")
          source_files = list((downloads / "windows").rglob("WINDOWS_SOURCE_COMMIT.txt"))
          if len(source_files) != 1:
              raise SystemExit("Windows source metadata is missing")
          windows_source = source_files[0].read_text(encoding="ascii").strip()
          if not re.fullmatch(r"[0-9a-f]{40}", windows_source):
              raise SystemExit("Windows source commit is invalid")

          metadata = {
              "version": full_version,
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "release_commit": os.environ["TARGET_SHA"],
              "tracked_files_dirty": False,
              "android_package": "com.mystyle.purelive",
              "android_signing": "release",
              "windows_signing": windows_signing,
              "build_source": "local-windows-android-plus-staged-linux-apple",
              "platform_source_commits": {
                  "android": os.environ["ANDROID_SHA"],
                  "windows": windows_source,
                  "linux": os.environ["STAGE_SHA"],
                  "macos": os.environ["STAGE_SHA"],
                  "ios": os.environ["STAGE_SHA"],
              },
              "source_runs": {
                  "android": int(os.environ["ANDROID_RUN_ID"]),
                  "stage": int(os.environ["STAGE_RUN_ID"]),
                  "publisher": int(os.environ["GITHUB_RUN_ID"]),
              },
          }
          metadata_path = output / "BUILD_METADATA.json"
          metadata_path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          checksum_path = output / "SHA256SUMS.txt"
          lines = []
          for path in sorted(output.iterdir(), key=lambda item: item.name):
              if path.name == checksum_path.name:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest} *{path.name}")
          checksum_path.write_text("\n".join(lines) + "\n", encoding="ascii")

          actual = {path.name for path in output.iterdir() if path.is_file()}
          wanted = set(expected) | {"BUILD_METADATA.json", "SHA256SUMS.txt"}
          if actual != wanted:
              raise SystemExit(f"release asset mismatch: {sorted(actual ^ wanted)}")
          for path in sorted(output.iterdir(), key=lambda item: item.name):
              print(f"{path.name}\t{path.stat().st_size}")
          PY

      - name: Extract current release notes
        shell: bash
        run: |
          python <<'PY'
          import pathlib
          import re
          import os

          notes = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          tag = os.environ["RELEASE_TAG"]
          match = re.search(
              rf"(?ms)^# Pure Live\s+{re.escape(tag)}\s*$.*?(?=^---\s*$|\Z)",
              notes,
          )
          if not match:
              raise SystemExit(f"release notes were not found for {tag}")
          pathlib.Path("current-release-notes.md").write_text(
              match.group(0).strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "Pure Live $RELEASE_TAG" \
              --notes-file current-release-notes.md \
              --draft=false --prerelease=false --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$TARGET_SHA" \
              --title "Pure Live $RELEASE_TAG" \
              --notes-file current-release-notes.md \
              --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify published asset set
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Refresh release catalog
        shell: bash
        run: |
          set -euo pipefail
          python tool/update_releases.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/releases.json; then
            exit 0
          fi
          git add assets/releases.json
          git commit -m "chore: index $RELEASE_TAG release assets [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
