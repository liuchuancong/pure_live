name: local-signed-android

on:
  workflow_dispatch:
    inputs:
      run_full_regression:
        description: Run full quality regression before packaging
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: local-signed-android-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android arm64-v8a on local runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This trusted ephemeral runner is dedicated to this repository.
          # Preserve Gradle/Flutter intermediates between manual release jobs;
          # the build script deletes final APKs and Git resets tracked files.
          clean: false
      - name: Select local Java 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          if ($env:RUNNER_TOOL_CACHE) {
            $candidates += Get-ChildItem (Join-Path $env:RUNNER_TOOL_CACHE 'Java_Zulu_jdk\25*\x64') `
              -Directory -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName
          }
          $candidates += @(
            'C:\Program Files\Android\Android Studio\jbr',
            $env:JAVA_HOME
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $jdk = $candidates |
            Where-Object {
              $java = Join-Path $_ 'bin\java.exe'
              if (-not (Test-Path -LiteralPath $java -PathType Leaf)) { return $false }
              $versionText = (& $java -version 2>&1 | Out-String)
              return $versionText -match 'version\s+"25(?:\.|\")'
            } |
            Select-Object -First 1
          if (-not $jdk) {
            throw 'Java 25 was not found in the runner cache, Android Studio JBR, or JAVA_HOME.'
          }
          $jdk = (Resolve-Path -LiteralPath $jdk).Path
          "JAVA_HOME=$jdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $jdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $jdk 'bin\java.exe') -version

      - name: Configure temporary release signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required signing secret is missing: $name"
            }
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'pure-live-release.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          @"
          storeFile=$($keyPath.Replace('\', '/'))
          storePassword=$env:STORE_PASSWORD
          keyPassword=$env:KEY_PASSWORD
          keyAlias=$env:KEY_ALIAS
          "@ | Set-Content -LiteralPath android/key.properties -Encoding ascii

      - name: Build signed arm64-v8a release locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qualityMode = if ('${{ inputs.run_full_regression }}' -eq 'true') {
            '-FullRegression'
          } else {
            '-SkipQuality'
          }
          $arguments = @(
            '-ExecutionPolicy', 'Bypass',
            '-File', '.\tool\build_local_release.ps1',
            '-Target', 'AndroidArm64',
            '-Configuration', 'Release',
            $qualityMode,
            '-RequireReleaseSigning',
            '-DedicatedBuild'
          )
          & PowerShell @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Stage only the current Android release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -LiteralPath pubspec.yaml -Pattern '^version:\s*(\S+)' |
            Select-Object -First 1
          if (-not $versionLine) {
            throw 'pubspec.yaml has no version field.'
          }
          $fullVersion = $versionLine.Matches[0].Groups[1].Value
          $artifactVersion = $fullVersion.Replace('+', '-')
          $source = Join-Path $PWD "local-artifacts\$artifactVersion"
          $stage = Join-Path $env:RUNNER_TEMP `
            "pure-live-android-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($name in @(
            "PureLive-$artifactVersion-arm64-v8a-release.apk",
            'BUILD_METADATA.json',
            'SHA256SUMS.txt'
          )) {
            $path = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Current release artifact is missing: $path"
            }
            Copy-Item -LiteralPath $path -Destination (Join-Path $stage $name) -Force
          }

      - name: Upload signed APK and verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-android
          path: ${{ runner.temp }}/pure-live-android-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath android/key.properties -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'pure-live-release.jks') `
            -Force -ErrorAction SilentlyContinue
