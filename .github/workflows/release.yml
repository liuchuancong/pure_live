name: app-build-action
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 Release 的 Tag (例如 v1.0.0)'
        required: true
  push:
    tags:
      - "v*"
jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [master]
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: 下载Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: key.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: 创建key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "17"
          cache: 'gradle'
      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 更新Flutter packages
        run: flutter pub get
      - name: 打包 APK
        run: flutter build apk --release --split-per-abi
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-master
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        branch: [master]
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Decode MSIX Certificate
        shell: pwsh
        run: |
          $certBase64 = "${{ secrets.CERTIFICATE }}".Trim() -replace '\s+', ''
          if ([string]::IsNullOrEmpty($certBase64)) {
            Write-Error "Secret is empty!"
            exit 1
          }
          $certBytes = [System.Convert]::FromBase64String($certBase64)
          $certPath = Join-Path -Path (Get-Location) -ChildPath "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "FINAL_CERT_PATH=$certPath" >> $env:GITHUB_ENV
      - name: Update make_config.yaml
        shell: pwsh
        run: |
          $configPath = "windows/packaging/msix/make_config.yaml"
          $absolutePath = $env:FINAL_CERT_PATH -replace '\\', '/'
          if (Test-Path $configPath) {
              $content = Get-Content $configPath -Raw
              $content = $content -replace 'certificate_path:\s*.*', "certificate_path: $absolutePath"
              Set-Content $configPath $content
              Write-Host "Success: certificate_path set to $absolutePath"
          }
          else {
              Write-Error "Config file not found!"
              exit 1
          }
      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 启用 Flutter Windows
        run: flutter config --enable-windows-desktop
      - name: 更新Flutter packages
        run: flutter pub get
      - name: Install fastforge (from source)
        shell: pwsh
        run: |
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate
          choco install innosetup
      - name: Copy Chinese language pack
        run: |
          $source = "windows\packaging\exe\ChineseSimplified.isl"
          $target = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (Test-Path $source) {
            Copy-Item $source $target -Force
          }
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml
          foreach ($line in $lines) {
            if ($line -match '^\s*version:\s*(\S+)') {
              $v = $matches[1] -replace '[`"''`]', ''
              "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }
          Write-Error "Version not found"
          exit 1
      - name: Package Windows
        run: fastforge package --platform windows --targets msix,zip,exe --skip-clean
      - name: Rename installers
        shell: pwsh
        run: |
          $VERSION = "${{ steps.get_version.outputs.version }}"
          $DIST_DIR = "dist"
          $EXE_FILE = Get-ChildItem $DIST_DIR -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($EXE_FILE) {
            Copy-Item $EXE_FILE.FullName "PureLive-$VERSION-windows-x64-setup.exe"
          }
          $MSIX_FILE = Get-ChildItem $DIST_DIR -Recurse -Filter "*.msix" | Select-Object -First 1
          if ($MSIX_FILE) {
            Copy-Item $MSIX_FILE.FullName "PureLive-$VERSION-windows-x64.msix"
          }
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-master
          path: |
            PureLive-*.exe
            PureLive-*.msix
          retention-days: 1
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: write
    strategy:
      matrix:
        branch: [master]
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: 设置JAVA环境（fastforge 可能需要）
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "21"
      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 启用 Flutter macOS
        run: flutter config --enable-macos-desktop
      - name: 更新Flutter packages
        run: flutter pub get
      # 安装 appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置 Fastforge 环境
      - name: Install fast-forge
        run: | 
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate
      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/[`"'"'"']//g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build macOS with fastforge
        run: fastforge package --platform macos --targets dmg,zip --skip-clean
      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd dist
          for f in *.dmg; do
            if [[ -f "$f" ]]; then
              mv "$f" "PureLive-${VERSION}-macOS.dmg"
            fi
          done
          for f in *.zip; do
            if [[ -f "$f" ]]; then
              mv "$f" "PureLive-${VERSION}-macOS.zip"
            fi
          done
      - name: 上传 DMG & ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-master
          path: |
            PureLive-*.dmg
            PureLive-*.zip
          retention-days: 1
       # 完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
      - build-macos
    permissions:
      contents: write
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: master
      - name: 计算 Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 读取版本描述
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/version.json
      - name: 构建 Release Body
        id: release_body
        run: |
          cat << 'EOF' > release_body.txt

          # 纯粹直播 ${{ github.ref_name }}
          |版本|下载地址|
          |---|---|
          |TV版|[pure_live_TV](https://github.com/liuchuancong/pure_live_TV/releases/latest)|
          |Windows/macOS/Android版|[pure_live](https://github.com/liuchuancong/pure_live/releases/latest)|

          ### 🖥️ Windows 版
          - **EXE 安装包**：适合所有用户，自动创建快捷方式
          - **MSIX 包**：现代应用格式，支持干净卸载（需 Windows 10/11）
          - 适配：Win10/11 (x64)，自动创建桌面快捷方式
          - 功能：多直播源、WebDAV、弹幕显示
          - 快捷键：空格(播放/暂停) \| ESC(全屏切换) \| 上下键(音量) \| R(刷新)

          ### 🍎 macOS 版
          感谢 RebornQ 开发 | 适配：macOS 10.15+ (x64) | 同 Windows 核心功能

          ### 📱 Android 版
          适配：Android 6.0+ | 功能：WebDAV、多播放器切换、弹幕、应用内更新

          ### 📺 TV 版
          适配：Android TV 6.0+ | 功能：直播源同步、多播放器、弹幕、应用内更新

          ### 📝 本次更新

          ${{ fromJson(steps.version.outputs.content).version_desc }}

          EOF
          echo "body_path=$(pwd)/release_body.txt" >> $GITHUB_OUTPUT
      - name: 删除已有 Release（如果存在）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" -y
      - name: 删除已有 Tag（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git push origin :refs/tags/${{ steps.tag.outputs.tag }}
      - name: 上传至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.release_body.outputs.body_path }}
          prerelease: false
          generate_release_notes: false
          append_body: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/android-apks-master/*.apk
            artifacts/windows-installer-master/*.exe
            artifacts/windows-installer-master/*.msix
            artifacts/macos-dmg-master/*.dmg
            artifacts/macos-dmg-master/*.zip
      - name: 输出状态
        if: always()
        run: 'echo "✅ Release published with status: ${{ job.status }}"'
  update-json:
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run update script
      run: python update_releases.py
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if [ -n "$(git status --porcelain)" ]; then
          git add assets/releases.json
          git commit -m "chore: 手动更新 releases.json 数据 [skip ci]"
          git pull --rebase origin master
          git push origin master
        else
          echo "数据未发生变化，无需更新。"
        fi