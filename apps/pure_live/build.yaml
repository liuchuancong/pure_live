# The app's code generation.
#
# The translations are NOT here: they are generated by the slang CLI from
# `slang.yaml` in this directory, run as `flutter pub run slang`. The
# slang_build_runner path cannot do its job any more — writing
# `lib/l10n/generated/strings*.dart` back over the committed files needs
# --delete-conflicting-outputs, which the installed build_runner removed — so
# the builder is switched off here and `slang.yaml` is the one configuration.
targets:
  $default:
    builders:
      slang_build_runner:
        enabled: false
