# The app's translations: slang's own config, consumed by `dart run slang`.
#
# Source JSON files live in `i18n/` at the app root and the generated code is
# written into `lib/i18n/`, per the directory spec. The generated file stays
# committed (a clone builds without a codegen step) and one command
# regenerates it; a per-run timestamp would only produce diff noise, and lazy
# loading would make the non-base locale an async import the shell cannot
# rely on, so both stay off.
base_locale: zh-CN
fallback_strategy: base_locale
input_directory: i18n
input_file_pattern: .i18n.json
output_directory: lib/i18n
output_file_name: translations.g.dart
string_interpolation: braces
lazy: false
timestamp: false
