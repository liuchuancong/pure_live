name: pure_live
description: >-
  Pure Live: the application composition root. It boots the platform layer,
  dresses the desktop window through live_shell_desktop, resolves the theme
  and the language, and assembles the shell and the feature pages. The
  business lives in the packages; this holds only the wiring.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # UI 与状态
  desen_ui: ^0.3.2 # 设计令牌、主题与组件
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2 # 状态管理与依赖注入
  go_router: ^18.0.2 # 路由
  slang: ^4.19.2 # 多语言生成与运行时
  slang_flutter: ^4.19.0 # 多语言的 Flutter 集成
  system_theme: ^3.3.0 # Windows 系统强调色

  # PureLive 内部包
  live_log: # 日志与诊断
  live_platform: # 平台区分与运行环境
  live_shell: # 外壳契约（窗口宿主、角色）
  live_shell_desktop: # 桌面窗口宿主（window_manager 对象 API）

  riverpod: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
