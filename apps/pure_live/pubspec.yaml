name: pure_live
description: >-
  Pure Live: the application composition root. It boots the platform layer,
  opens the storage, installs the logging and network stacks, resolves the theme
  from the user's preferences and assembles the pages out of the business
  packages.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # 系统与设备
  android_intent_plus: ^6.1.0 # 调用 Android 系统意图
  audio_session: ^0.2.4 # 系统音频焦点：通话/闹钟中断与耳机拔出
  package_info_plus: ^10.2.2 # 应用版本信息

  # 窗口与桌面集成
  dynamic_app_icon_flutter_plus: ^2.2.1 # 动态应用图标
  multiview_desktop: ^2.0.2 # 单 Engine 多视图窗口
  restart_app: ^1.10.1 # 重启应用
  screen_retriever: ^0.3.0 # 屏幕与显示器信息
  system_theme: ^3.3.0 # Windows 系统强调色
  tray_manager: ^0.8.0 # 系统托盘
  vibrancy: ^0.1.1 # 窗口透明与材质效果

  # 文件与外部操作
  archive: ^4.5.2 # 压缩包读写
  crypto: ^3.0.0 # 字体文件的 SHA-256 校验
  file_picker: ^13.1.0 # 选择文件或目录
  file_selector: ^1.1.0 # 原生文件选择器
  open_file: ^4.0.0 # 调用系统打开文件
  path: ^1.9.0 # 路径拼接与处理
  path_provider: ^2.1.6 # 获取应用目录
  share_plus: ^13.3.1 # 系统分享面板
  url_launcher: ^6.3.3 # 打开链接或外部应用
  equatable: ^3.0.0

  # UI、图片与布局
  animations: ^3.0.0 # 常用动画效果
  any_image_view: ^2.5.0 # 多来源图片展示
  cached_network_image: ^4.0.4 # 网络图片缓存
  flutter_cache_manager: ^3.4.5 # 图片缓存的体积与清理
  custom_refresh_indicator: ^4.0.2 # 自定义下拉刷新
  desen_ui: ^0.3.2 # 设计令牌、主题与组件
  dynamic_color: ^1.7.0 # Android 12+ 动态取色
  dynamic_fonts: ^3.1.0 # 云端字体的运行时下载、校验、缓存与注册
  flutter_helper_utils: ^10.0.0
  flutter_keyboard_visibility: ^7.0.1 # 监听软键盘状态
  flutter_screenutil_plus: ^2.0.0 # 自适应布局辅助
  flutter_svg: ^2.3.0 # SVG 图片渲染
  lucide_icons_flutter: ^4.0.1 # Lucide 图标库
  flame_barrage: ^0.0.9 # 飞行弹幕渲染（media_core_danmaku 的火焰宿主）
  pretty_qr_code: ^3.6.0 # 生成二维码

  # Flutter 与状态管理
  built_collection: ^5.1.2 # 不可变集合
  built_value: ^8.13.0 # 不可变模型
  collection: ^1.19.1 # 集合处理工具
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2 # 状态管理与依赖注入
  flutter_secure_storage: 11.2.0 # 安全存储密钥
  http: ^1.0.0 # dynamic_fonts 的取字接口（本地文件适配器）
  go_router: ^18.0.2 # 路由管理
  slang: ^4.19.2 # 多语言代码生成基础
  slang_flutter: ^4.19.0 # Flutter 多语言集成
  wakelock_plus: 1.8.1 # 播放中保持屏幕常亮

  # PureLive 内部功能包
  live_device: # 电量、亮度、音量、刷新率等设备能力
  live_iptv: # IPTV 业务
  live_log: # 日志系统
  live_net: # 网络请求层
  live_pagination: # 分页工具
  live_platform: # 平台能力抽象
  live_platform_path_provider: # 平台数据路径
  live_shell: # 通用应用外壳
  live_shell_desktop: # 桌面端外壳
  live_sites: # 直播平台与站点适配
  live_storage: # 存储与数据仓库
  live_vod: # 视频点播源
  live_websocket: # WebSocket 连接
  pure_uikit_background: # 背景样式与图层

  # 播放内核（本地 F:/media_core，绝对路径；沙盒 player-lab 已验证解析）
  media_core: { path: F:/media_core/packages/media_core } # 播放器内核
  media_core_live: { path: F:/media_core/packages/media_core_live } # 直播恢复编排（线路×引擎扫描）
  media_core_media_kit: { path: F:/media_core/packages/media_core_media_kit } # mpv 后端
  media_core_ijk_player: { path: F:/media_core/packages/media_core_ijk_player } # Android/iOS 内核
  media_core_better_player: { path: F:/media_core/packages/media_core_better_player } # Android/iOS 内核
  media_core_danmaku: { path: F:/media_core/packages/media_core_danmaku } # 弹幕管线（过滤/摄录）
  media_core_recording_ffmpeg: { path: F:/media_core/packages/media_core_recording_ffmpeg } # FFmpeg 录制后端
  media_core_presentation: { path: F:/media_core/packages/media_core_presentation } # 呈现驱动
  media_core_audio: { path: F:/media_core/packages/media_core_audio } # 音乐播放（队列/歌词/后台）
  media_core_fullscreen: { path: F:/media_core/packages/media_core_fullscreen } # 全屏驱动
  media_core_pip: { path: F:/media_core/packages/media_core_pip } # 画中画驱动
  media_core_cast_dlna: { path: F:/media_core/packages/media_core_cast_dlna } # DLNA 投屏后端
  media_core_mediasession: { path: F:/media_core/packages/media_core_mediasession } # 媒体会话通知
  media_core_notify: { path: F:/media_core/packages/media_core_notify } # 用户通知

  responsive_breakpoints: ^1.0.3 # 断点定义与解析（Tailwind/Material/Bootstrap）

  # 路由、配置与序列化
  envied: ^1.3.10 # 编译期环境变量
  fpdart: ^1.2.0
  markdown: ^7.3.1 # Markdown 内容渲染
  pub_semver: ^2.2.1 # 语义化版本比较
  riverpod_annotation: ^4.0.7 # Riverpod 生成器注解
  webview_flutter: ^4.14.1 # 内嵌网页视图
  catcher_2: ^3.0.0-alpha.0
  desktop_drop: ^0.8.4
dev_dependencies:
  # 代码生成
  build_runner: ^2.16.2 # 运行代码生成器
  built_value_generator: ^8.13.0 # 生成 built_value 模型
  envied_generator: ^1.3.10 # 生成环境变量代码
  go_router_builder: ^4.5.0 # 生成类型安全路由
  icons_launcher: ^3.1.0 # 生成应用图标
  riverpod_generator: ^4.0.9 # 生成 Riverpod Provider
  slang_build_runner: ^4.19.0
  # 测试与规范
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.0.0 # Riverpod 代码检查
  very_good_analysis: ^11.0.0 # Dart 静态分析规则

  # 开发辅助
  slang_mcp: ^0.2.1 # 多语言开发辅助工具（MCP 服务器）

flutter:
  uses-material-design: true

  # 预设字体：各设计语言的官方字体随应用打包，开箱即用。
  # 每族只内置 Regular（400）一档，粗字重由引擎合成。
  # Segoe UI（fluent）走 Windows 系统自带，不占资源。
  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SFPro/SFProDisplay-Regular.otf
    - family: SFRounded
      fonts:
        - asset: assets/fonts/SFRounded/SFProRounded-Regular.otf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu/UbuntuSans-Regular.ttf
  assets:
    - assets/tray/ # 系统托盘图标
    - assets/icon/ # 启动页的品牌图（母图）
    - assets/shaders/ # Anime4K 超分辨率着色器
    # 云端字体目录：只随包携带清单，字体文件由 dynamic_fonts 按需下载并缓存。
    - assets/fonts/fonts-manifest.json

# 启动图标：assets/icon/app_icon.png 是唯一母图，各平台的图标资源全部由它生成。
# 换图标只改母图，然后跑：dart run icons_launcher:launch
icons_launcher:
  image_path: assets/icon/app_icon.png
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    windows:
      enable: true
