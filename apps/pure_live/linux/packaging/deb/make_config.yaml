# linux --targets deb` runs in build_pure_live_release.yml. Field names and
# semantics follow fastforge's MakeDebConfig; installed_size is rewritten from
# the built bundle size by the packaging step. The install layout comes from
# fastforge itself: since 0.6.7 the bundle goes to /opt/pure_live/ (earlier
# releases used /usr/share/pure_live/); the desktop entry and launcher wiring
# are generated by fastforge.
