include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Dependencies here are grouped by purpose (device, windowing, UI, codegen)
    # with a note per line, which a flat A-Z list cannot express.
    sort_pub_dependencies: ignore

formatter:
  page_width: 120

linter:
  rules:
    lines_longer_than_80_chars: false
    public_member_api_docs: true
