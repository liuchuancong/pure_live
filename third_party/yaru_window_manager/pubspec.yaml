# Vendored fork of yaru_window_manager 0.1.3 (MPL-2.0, https://github.com/ubuntu/yaru_window.dart),
# kept in-tree and patched by exactly one thing: it drives `window_frame_kit` instead of
# `window_manager`, so this app has one window-procedure delegate instead of two.
# window_frame_kit 0.3.0 is a verbatim port of window_manager 0.5.2 — the public member names
# are identical except the frame-takeover and diagnostics additions — which is why the only
# source change is the import in lib/src/window_manager.dart.
name: yaru_window_manager
description: |
  A window_frame_kit-based implementation of yaru_window for macOS and Windows.
version: 0.1.3
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  window_frame_kit: ^0.3.0
  yaru_window_platform_interface: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  plugin:
    implements: yaru_window
    platforms:
      macos:
        dartPluginClass: YaruWindowManager
      windows:
        dartPluginClass: YaruWindowManager
