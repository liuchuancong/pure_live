include: package:flutter_lints/flutter.yaml
formatter:
  page_width: 120
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*_en.dart"
    - "**/*_zh_CN.dart"
    - "**/*.js"
    - build/**
    # v1 原代码整体移入 legacy:仅作协议参考,不参与 v2 构建与分析。
    - legacy/**
    # Device captures, build records and one-off forensic helpers live here;
    # they are evidence artifacts rather than application source.
    - local-artifacts/**
    # Opt-in external/native probes run standalone against device fixtures;
    # they are not part of the app quality gate.
    - tool/probes/**
    # Vendored upstream package (Predidit/media-kit@803c4a27); analyzed upstream.
    - third_party/media_kit/**
    - third_party/fvp/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Third-party source is pinned and patched only in its Android registrar.
    # Keep the app quality gate focused on code maintained in this repository.
    - plugins/flv_lzc/**
    - plugins/built_in_kotlin/**
    # Pinned upstream package; patched files are compiled by Android/desktop
    # builds and its pure state policy is covered by the app regression suite.
    - third_party/media_kit_video/**
linter:
  rules:
