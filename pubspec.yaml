# Pure Live workspace. Members are added one refactored module at a time and
# share this directory's pubspec.lock. Dependency overrides may only be
# declared here. See docs/packages-migration.md for the migration plan.
name: pure_live_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/pure_live
  - packages/live_device
  - packages/live_interaction
  - packages/live_iptv
  - packages/live_library
  - packages/live_log
  - packages/live_net
  - packages/live_pagination
  - packages/live_platform
  - packages/live_platform_path_provider
  - packages/live_playback
  - packages/live_playback/example
  - packages/live_record_core
  - packages/live_shell
  - packages/live_shell_desktop
  - packages/live_sites
  - packages/live_storage
  - packages/live_storage/example
  - packages/pure_settings_ui
  - packages/pure_uikit
  - packages/pure_uikit_background
  - packages/pure_uikit_background/example
  - packages/live_websocket

dev_dependencies:
  kareki: ^0.7.0
  melos: ^8.9.0

# Overrides apply to the whole workspace and may only be declared here.
# melos 8.9.0 caps platform <3.2.0 while yaru 11 requires ^3.2.0; platform
# 3.2.x is what the app already resolves to, so melos is made to accept it.
# battery_plus (upower -> dbus ^0.7) and network_info_plus (nm -> dbus ^0.8)
# pin disjoint dbus majors; force dbus 0.8 so the workspace resolves. If a
# device-info feature later needs upower against 0.8, align the *_plus versions
# instead of relying on this override.
# code_assets / hooks: the ffmpeg_kit_extended_flutter that the recording
# backend binds declares code_assets ^1.2.1 / hooks ^2.0.2 while the media_kit
# fork needs code_assets ^2.1.0; the media_core workspace carries the same two
# overrides for the same reason (see its root pubspec).
dependency_overrides:
  code_assets: ^2.1.0
  dbus: ^0.8.0
  equatable: ^3.0.0
  ffmpeg_kit_extended_flutter: ^0.6.2
  hooks: ^2.2.0
  media_core:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: ./packages/media_core
      ref: 1dc8b4a302cb60914b5c2b38cd31bf4a6afa266c
  media_core_native:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: ./packages/media_core_native
      ref: 1dc8b4a302cb60914b5c2b38cd31bf4a6afa266c
  platform: ^3.2.0
  test_api: ^0.7.15
  wakelock_plus: 1.8.1
  win32: ^6.4.0
  # The published 0.3.0 discards the whole window surface on every step of a
  # caption drag (it forces SWP_NOCOPYBITS at WM_WINDOWPOSCHANGING whenever
  # SWP_NOSIZE is absent, and a pure move passes unchanged cx/cy without that
  # flag), which is the title-bar flicker. The fix — gate the discard on the
  # size actually changing — landed on master as 0.3.1 (2026-10-17) and is not
  # published or tagged yet, so the git source is pinned to that commit rather
  # than to the branch name. The Dart API is byte-identical to 0.3.0; only three
  # files under `windows/` differ. Drop this override once pub.dev serves 0.3.1.
  window_frame_kit:
    git:
      url: https://github.com/TATboy210/window_frame_kit
      ref: 1e0db6871150d0e11cf67ab2f8ee1e9173fd9bee
  xml: ^7.0.0
  # yaru's window layer only exists as yaru_window_manager, which depends on window_manager;
  # window_manager pins screen_retriever ^0.2.x and window_frame_kit 0.3.0 needs ^0.3.0, and
  # neither compiles against the other's version. The fork under third_party/ swaps one import
  # (window_frame_kit is a verbatim port), so the app ends up with a single window delegate.
  yaru_window_manager:
    path: third_party/yaru_window_manager

melos:
  scripts:
    gen:
      description: Run build_runner code generation in every package that uses it.
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn:
          - build_runner
      env:
        CI: "true"
    analyze:
      description: Run dart analyze in every workspace package.
      exec:
        command: dart analyze
        concurrency: 1
      env:
        CI: "true"
    format:
      description: Format every workspace package.
      exec:
        command: dart format .
    kareki:
      description: Workspace-wide dead code scan; new findings fail, baselined ones pass.
      run: dart run kareki --baseline .kareki-baseline.json


ffmpeg_kit_extended_config:
  type: "base"
  gpl: true
  small: true
