# 仓库根 = pub workspace hub:不放代码,只做成员清单与全仓依赖裁决。
# 应用(组合根)在 apps/pure_live;分层包在 packages/<层>/<包>。见 docs/architecture/package-architecture.md
name: pure_live_workspace
description: PureLive v2 单仓多包的 workspace 根包。
publish_to: none
environment:
  sdk: ^3.13.0

workspace:
  - apps/pure_live
  - packages/ecosystem/capability
  - packages/ecosystem/extension
  - packages/ecosystem/external_tvbox
  - packages/ecosystem/identity
  - packages/ecosystem/permission
  - packages/ecosystem/platform
  - packages/ecosystem/plugin_api
  - packages/ecosystem/resolver
  - packages/ecosystem/task
  - packages/foundation/auth
  - packages/foundation/backup
  - packages/foundation/cache
  - packages/foundation/diagnostics
  - packages/foundation/events
  - packages/foundation/files
  - packages/foundation/l10n
  - packages/foundation/logging
  - packages/foundation/network
  - packages/foundation/platform_info
  - packages/foundation/release
  - packages/foundation/storage
  - packages/foundation/sync
  - packages/foundation/utils
  - packages/integrations/firebase
  - packages/integrations/media
  - packages/integrations/python_runtime
  - packages/providers/demo
  - packages/services/favorites
  - packages/services/feed
  - packages/services/history
  - packages/services/playlist
  - packages/services/search

# 全仓统一裁决的依赖覆盖:workspace 里只有根包可以声明。
# Dependencies of repository tooling only; the hub itself ships no code.
# yaml is already resolved in the lockfile as a transitive dependency of the build
# toolchain, so this adds no new package to the graph: tool/check_architecture.dart
# needs a real YAML parser to read pubspec files, and a hand-rolled one would let a
# misplaced dependency slip through the architecture gate.
dev_dependencies:
  yaml: ^3.1.2

dependency_overrides:
  # media_kit 链与 better_player_plus 对 wakelock_plus 的约束无交集,
  # 与 media_core 工作区同样以 override 对齐
  wakelock_plus: ^1.7.0
  _fe_analyzer_shared: 108.0.0
  analyzer: 14.4.0
  cli_util: 0.6.0
  dbus: 0.8.0
  file_picker_linux: 2.0.1
  material_color_utilities: 0.13.1
  nm: 0.6.0
  source_gen: 4.3.0
  test_api: 0.7.14
  xml: ^6.4.0
  flutter_inappwebview_android:
    path: third_party/built_in_kotlin/flutter_inappwebview_android # 上游网页内核Android子包ProGuard兼容补丁
  share_handler_android:
    path: third_party/built_in_kotlin/share_handler_android # share_handler Android本地兼容补丁
  hooks: ^2.2.0 # Native Assets 构建 hooks 兼容
  code_assets: ^2.1.0 # media_kit Native Assets 2 and FFmpeg hook compatibility
  mime: ^2.1.0 # media_core 需 mime ^2.1.0，与 alfred 的 ^1.0.0 冲突；alfred 仅用 MimeMultipartTransformer/MimeMultipart（2.x 未变），覆盖安全
  equatable: ^3.0.0 # media_core 需 equatable ^3.0.0；app 与 flutter_screenutil_plus 均为 extends Equatable + props（3.x 兼容），覆盖安全

# 与 apps/pure_live/pubspec.yaml 的同名段取值必须一致。ffmpeg_kit_extended_flutter 的构建钩子用
# .dart_tool/package_config.json 反推"应用目录"(取 dirname 两次),而 pub workspace 把这份文件放在仓库根,
# 所以钩子只看得到本文件:这里不写,应用声明的 base / 非 small 就被忽略,它回退到的上游 small 包连解包路径都对不上
# (hook 期望 <name>/<name>/*)。权威在应用侧,这段是插件发现方式逼出来的镜像,上游修好 workspace 感知后应删除。
# 两个平台键是本地路径 override(不下载、不做上游哈希校验),指向 native-assets/ 下由
# tool/prefetch_android_native.ps1 校验哈希后落盘的工件;该目录不入库,顺序必须是 prefetch 在 test/build 之前。
ffmpeg_kit_extended_config:
  type: base
  gpl: false
  small: false
  windows: native-assets/bundle-base-windows-x86_64-shared-lgpl.zip
  android: native-assets/bundle-base-shared-lgpl-release.aar
