group 'com.befovy.fijkplayer'
version '1.0.0'

group = "com.example.my_flutter_plugin"
version = "1.0-SNAPSHOT"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

repositories {
    // The published 1.0.4 arm64 binaries use 4 KB ELF LOAD alignment.
    // Resolve the byte-compatible Pure Live rebuild from the repository-local
    // Maven layout so this library project can consume the AAR transitively.
    maven {
        url = uri("$projectDir/libs")
        content {
            includeModule("io.github.flutterplayer", "fplayer-core")
        }
    }
}

android {
    namespace = "com.example.my_flutter_plugin"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 16
    }

    dependencies {
        implementation 'androidx.annotation:annotation:1.2.0'
        implementation 'io.github.flutterplayer:fplayer-core:1.0.4-purelive16k'
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}
