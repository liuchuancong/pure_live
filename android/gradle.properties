org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.vfs.watch=true
org.gradle.workers.max=16
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.socks.proxyHost=127.0.0.1
# systemProp.socks.proxyPort=7898
# AGP 9 Built-in Kotlin avoids a second Kotlin Gradle Plugin instance in the app and plugins.
android.builtInKotlin=true
# Keep the stable Android DSL while plugin compatibility is verified independently.
android.newDsl=false
# Flutter 3.47's generic KGP check rejects AGP's supported built-in compiler
# version. The repository audit below pins and validates the complete AGP/Gradle pair.
skipDependencyChecks=true
org.gradle.dependency.verification=off
org.gradle.warning.mode=none
# The wrapper keeps one stable same-drive short-path mapping so Kotlin/Gradle
# incremental state remains reusable between focused checks and staged builds.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
