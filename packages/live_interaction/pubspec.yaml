name: live_interaction
description: >-
  Live interaction sessions for Pure Live: one session per room merging
  several interaction sources (danmaku today), with message dedup and
  reconnect-gate, a filter chain over the shared LiveMessage models,
  audience-update distribution and lifecycle/reconnect coordination. Pure
  Dart; the platform protocols stay in live_sites.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  live_sites:
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.0
  very_good_analysis: ^11.0.0
