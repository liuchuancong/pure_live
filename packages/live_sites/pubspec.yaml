name: live_sites
description: >-
  Site domain and adaptation contracts for Pure Live: unified room, play
  and danmaku models; the LiveSite contract that takes LiveRoom first;
  the site registry with metadata; and per-platform adapters. Pure Dart —
  players, renderers, HTTP transports and persistence live above or
  beside it.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  brotli_neo: ^0.2.0
  built_collection: ^5.1.2 # 不可变集合
  built_value: ^8.13.0 # 不可变模型
  crypto: ^3.0.6
  fpdart: ^1.2.0
  hls: 1.0.0
  live_net:
  live_websocket:
  meta: ^1.19.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.16.2 # 运行代码生成器
  built_value_generator: ^8.13.0 # 生成 built_value 模型
  test: ^1.25.15
  very_good_analysis: ^11.0.0

# Platform icons, bundled for the Flutter app that owns this package: every
# manifest's icon is one of these files, referenced package-relative.
flutter:
  assets:
    - assets/platforms/
