name: live_sites
description: >-
  Site domain and adaptation contracts for Pure Live: unified room, play
  and danmaku models; the LiveSite contract that takes LiveRoom first;
  the site registry with metadata; and per-platform adapters. Pure Dart —
  players, renderers, HTTP transports and persistence live above or
  beside it.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.6
  cryptography: ^2.7.0
  equatable: ^2.0.7
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  html: ^0.15.6
  json_annotation: ^4.12.0
  live_net:
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.0
  very_good_analysis: ^11.0.0
