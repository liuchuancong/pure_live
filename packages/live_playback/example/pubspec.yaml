name: live_playback_example
description: >-
  Runnable tour of live_playback: the live-room page, the vertical feed, the
  multi-view grid, the overlay hand-off and the background policy — driven by
  the kernel's fake backend, so every scenario can be walked without a network,
  a video codec or a platform window system.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  live_playback:
  # Path rather than a version: media_core is not a pub.dev package. In a real
  # app this is the same line, pointing at the checkout you build against.
  media_core:
    path: ../../../../../media_core/packages/media_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
