name: live_storage
description: >-
  Storage infrastructure for a host application: the SQLite database over
  drift, its schema and migrations, namespaced JSON stores, the settings
  facade and the migration contracts. Pure Dart; the app shell injects the
  database directory and opens it in the window that owns the store.
version: 0.2.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.3
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  test: ^1.33.0
  very_good_analysis: ^11.0.0
