name: live_storage
description: >-
  Storage infrastructure for a host application: bootstrap and lifecycle over
  Hive CE, typed box opening through hive_box_manager, typed storage
  repositories, migration contracts, diagnostics and the JSON box
  adapter bridge. Pure Dart; the app shell injects the storage
  directory and registers adapters.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  hive_box_manager: ^1.2.0
  hive_ce: ^2.20.2

dev_dependencies:
  build_runner: ^2.7.1
  hive_ce_generator: ^1.11.3
  test: ^1.33.0
  very_good_analysis: ^11.0.0
