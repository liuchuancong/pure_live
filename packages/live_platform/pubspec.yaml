name: live_platform
description: >-
  Cross-platform runtime layer for Pure Live: it distinguishes platforms —
  the OS family, the presentation form factor (phone/tablet/desktop/TV,
  overridable by the user) and the desktop deployment style (installed /
  MSIX / portable, declarable and marker-detectable) — and derives the
  conservative capability set from them. Directory and storage decisions
  live in live_platform_path_provider.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  path: ^1.9.0

dev_dependencies:
  test: ^1.33.0
  very_good_analysis: ^11.0.0
