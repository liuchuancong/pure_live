# Shared codegen options for live_iptv models.
#
# explicit_to_json makes json_serializable call `.toJson()` on nested
# freezed values (`IptvChannel.entry` is an `IptvEntry`) instead of
# embedding the object raw. The document lands in a Hive box, where an
# unregistered type fails the write with `HiveError: Cannot write,
# unknown type` and the read with a `Map` cast.
targets:
  $default:
    builders:
      json_serializable:
        options:
          explicit_to_json: true
