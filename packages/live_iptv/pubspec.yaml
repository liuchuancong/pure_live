name: live_iptv
description: >-
  IPTV for Pure Live: M3U/TXT playlist parsing, the channel and playlist
  models, channel groups with favourites and ordering, import with
  reconcile, and a channel source that exposes the library through the
  live_sites IPTV site. Pure Dart; the player stays behind the playback
  packages.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  live_net:
  live_sites:
  live_storage:
  meta: ^1.19.0
  xml: ^7.0.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
