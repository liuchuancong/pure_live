name: live_iptv
description: >-
  IPTV for Pure Live: M3U/TXT playlist parsing, the channel and playlist
  models, channel groups with favourites and ordering, import with
  reconcile, and a channel source that exposes the library through the
  live_sites IPTV site. Pure Dart; the player stays behind the playback
  packages.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  built_collection: ^5.1.2 # 不可变集合
  built_value: ^8.13.0 # 不可变模型
  live_net:
  live_sites:
  live_storage:
  meta: ^1.19.0
  xml: ^7.0.0

dev_dependencies:
  build_runner: ^2.16.0
  built_value_generator: ^8.13.0 # 生成 built_value 模型
  test: ^1.33.0
  very_good_analysis: ^11.0.0
