name: live_library
description: >-
  The user's room library for Pure Live: followed rooms, follow groups,
  watch history and recent rooms, persisted as JSON through the live_storage
  preferences seam. The persisted record keeps the LiveRoom snapshot apart
  from the user's own metadata (note, groups, ordering), so refreshing a
  room never overwrites what the user wrote. Pure Dart; no platform calls,
  no UI.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  live_sites:
  live_storage:
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.0
  test: ^1.25.15
  very_good_analysis: ^11.0.0
