name: live_uikit
description: >-
  The unified UI system of Pure Live: design tokens, one component contract
  with per-design-language implementations, themes, page backgrounds and
  later the TV focus infrastructure. Business pages depend on this package
  and never on a design language library directly.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  fluent_ui: ^4.16.1
  flutter:
    sdk: flutter
  flutter_neumorphic_plus: ^3.5.0
  fluttersdk_wind: ^1.8.1
  freezed_annotation: ^3.1.0
  macos_ui: ^2.2.2
  meta: ^1.19.0
  yaru: ^11.0.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.2
  very_good_analysis: ^11.0.0
