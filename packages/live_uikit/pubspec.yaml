name: live_uikit
description: >-
  The unified UI system of Pure Live: an Ant Design-style design-token core and
  a runtime-switchable theme (brightness, accent, font family and scale,
  density, background, transparency) plus the adapter contracts and shared
  controls. Per-design-language adapters (Material, Cupertino, fluent, macos,
  neumorphic, glass, wind) live in their own live_uikit_* packages, so this
  core never depends on a third-party UI library. Business pages depend on this
  package and never on a design language library directly.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  very_good_analysis: ^11.0.0
