name: live_preferences
description: >-
  Typed user preferences for Pure Live: playback, danmaku, library, TV
  navigation, floating window and appearance groups, persisted as versioned
  JSON documents through the live_storage store. Pure Dart; the UI reads it
  and the business packages take it as configuration.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  live_storage:
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.0
  very_good_analysis: ^11.0.0
