name: live_shell_desktop
description: >-
  The plugin-backed implementation of live_shell's seams for Windows, macOS and
  Linux: a WindowHost over window_frame_kit, a TrayHost over tray_manager, a
  display reader over screen_retriever and a window launcher over
  desktop_multi_window. live_shell decides what a window should do; this is the
  part that asks the operating system to do it.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  bitsdojo_window:
    git:
      url: https://github.com/Ali-Fadaei/bitsdojo_window.git
      path: bitsdojo_window
      ref: 358bc8dfa9f560ba652fb022956e1c580968c76b
  desktop_multi_window: ^0.3.1
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_acrylic:
    git:
      url: https://github.com/mbpowers/flutter_acrylic.git
      ref: 2fe854639aa3eb6bf7863140e2738dd001cb10a1
  live_platform:
  live_shell:
  nativeapi: ^0.5.2 # 系统通知（nativeapi 的 NotificationManager，与 tray_manager 同栈）
  screen_retriever: ^0.3.0
  tray_manager: ^0.8.0
  window_frame_kit: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
